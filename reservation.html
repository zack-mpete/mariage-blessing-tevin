<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/reservation.css" />
    <title>Réservation - Mariage Blessing & Tevin</title>
  </head>
  <body>
    <header>
      <span>B&T</span>
      <nav>
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="reservation.html">Reserver votre place</a></li>
          <li><a href="galerie.html">Galerie</a></li>
          <li><a href="livredor.html">Livre d'or</a></li>
        </ul>
      </nav>
      <div class="menuIcon">☰</div>
    </header>

    <main>
      <div class="titre-page">Réserver votre place</div>

      <section class="form">
        <form id="reservation-form">
          <!-- Message d'erreur -->
          <div
            id="error-message"
            class="error-message"
            style="display: none"
          ></div>

          <!-- Message de succès -->
          <div
            id="success-message"
            class="success-message"
            style="display: none"
          ></div>

          <!-- Options de réservation -->
          <div class="reservation-options">
            <div class="option-group">
              <input
                type="radio"
                id="option-seul"
                name="reservation-type"
                value="seul"
                checked
              />
              <label for="option-seul" class="option-label">
                <span class="option-icon">👤</span>
                <span class="option-text">Seul</span>
              </label>
            </div>

            <div class="option-group">
              <input
                type="radio"
                id="option-couple"
                name="reservation-type"
                value="couple"
              />
              <label for="option-couple" class="option-label">
                <span class="option-icon">👥</span>
                <span class="option-text">En couple</span>
              </label>
            </div>
          </div>

          <!-- Champ nom dynamique -->
          <div class="form-group">
            <label for="name" id="name-label">Nom & prénom *</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Votre nom et prénom"
              required
            />
            <div class="Avertissement">
            <span>Avertissement:</span>
            <small class="hint" id="name-hint"
              >Veuillez entrer votre vrai nom et prénom</small
            >
            </di>
          </div>

          <button type="submit" id="submit-button" class="submit-btn">
            <span class="button-text">Voir mon invitation</span>
            <span
              id="loading-indicator"
              class="loading-indicator"
              style="display: none"
              >Chargement...</span
            >
          </button>
        </form>
      </section>
    </main>

    <footer>© 2025 Mariage Blessing & Tevin</footer>

    <script src="js/style.js"></script>
    <script src="js/reservation.js"></script>
  </body>
</html>
